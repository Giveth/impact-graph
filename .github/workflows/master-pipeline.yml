name: master-pipeline

on:
  push:
    branches:
      - master

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.11.0

      # ESLint and Prettier must be in `package.json`
      - name: Install Node.js dependencies
        run: npm ci

      - name: Run linters
        uses: wearerequired/lint-action@v2
        with:
          eslint: true
          #prettier: true
          continue_on_error: true

  publish:
    #    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Login to GitHub Container Registry
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build image and push to GitHub Packages
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/giveth/impact-graph:master
            ghcr.io/giveth/impact-graph:${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Redeploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST_ALL }}
          username: ${{ secrets.PROD_USERNAME_ALL }}
          key: ${{ secrets.PROD_PRIVATE_KEY_ALL }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd giveth-all
            # Pin to the immutable per-commit tag so every job in this run deploys the
            # same image. Scoped inline rather than written to a file, because env on
            # these hosts is managed centrally via Vault.
            IMPACT_GRAPH_IMAGE="ghcr.io/giveth/impact-graph:${{ github.sha }}" \
              docker compose -f docker-compose.prod.yml pull

  migrate:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Run DB Migrations (one-shot)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST_ALL }}
          username: ${{ secrets.PROD_USERNAME_ALL }}
          key: ${{ secrets.PROD_PRIVATE_KEY_ALL }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd giveth-all
            echo "Running database migrations (one-shot) before rollout"
            # One-shot container: runs migrations, then exits. Non-zero exit fails the deploy.
            IMPACT_GRAPH_IMAGE="ghcr.io/giveth/impact-graph:${{ github.sha }}" \
              docker compose -f docker-compose.prod.yml run --rm impact-graph-migrations
            echo "Migrations complete"

  rollout-deploy-1:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Redeploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST_ALL }}
          username: ${{ secrets.PROD_USERNAME_ALL }}
          key: ${{ secrets.PROD_PRIVATE_KEY_ALL }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd giveth-all
            ## Single ql service (images were pulled earlier)
            IMPACT_GRAPH_IMAGE="ghcr.io/giveth/impact-graph:${{ github.sha }}" \
              docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate impact-graph-ql1
            echo "Deployment triggered. Health checks deferred to verify-health job."

  retire-remote-jobs:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Stop Old Prod Jobs Worker (dedicated jobs droplet)
        uses: appleboy/ssh-action@v1.0.0
        with:
          # The prod worker used to run on the shared jobs droplet (reached with the
          # STAGING_JOBS_* credentials). Cron must run in EXACTLY ONE place, so make
          # sure it is gone before starting the worker on the main server. Idempotent;
          # this job can be removed once the droplet worker is confirmed decommissioned.
          # The staging worker on that droplet is left untouched.
          host: ${{ secrets.STAGING_JOBS_HOST }}
          username: ${{ secrets.STAGING_JOBS_USERNAME }}
          key: ${{ secrets.STAGING_JOBS_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            if docker inspect impact-graph-jobs-prod >/dev/null 2>&1; then
              echo "Removing impact-graph-jobs-prod from the jobs droplet"
              docker rm -f impact-graph-jobs-prod
            else
              echo "impact-graph-jobs-prod not present on the jobs droplet; nothing to do"
            fi

  deploy-jobs:
    needs: retire-remote-jobs
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Redeploy Jobs (main server)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST_ALL }}
          username: ${{ secrets.PROD_USERNAME_ALL }}
          key: ${{ secrets.PROD_PRIVATE_KEY_ALL }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd giveth-all
            # Image was pulled in the deploy job.
            IMPACT_GRAPH_IMAGE="ghcr.io/giveth/impact-graph:${{ github.sha }}" \
              docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate impact-graph-jobs
            echo "Jobs deployment triggered. Health checks deferred to verify-health job."

  verify-health:
    needs:
      - rollout-deploy-1
      - deploy-jobs
    runs-on: ubuntu-latest
    steps:
      - name: Wait for services to stabilize
        run: sleep 180
      - name: SSH and Verify Health
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST_ALL }}
          username: ${{ secrets.PROD_USERNAME_ALL }}
          key: ${{ secrets.PROD_PRIVATE_KEY_ALL }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd giveth-all
            services=("impact-graph-ql1" "impact-graph-jobs")
            for svc in "${services[@]}"; do
              echo "Checking health for $svc ..."
              ok=0
              for i in {1..12}; do
                status=$(docker inspect --format='{{json .State.Health.Status}}' "$svc" 2>/dev/null || echo '""')
                if [ "$status" = "\"healthy\"" ]; then
                  echo "$svc is healthy"
                  ok=1
                  break
                fi
                echo "Current health: $status; waiting..."
                sleep 10
              done
              if [ $ok -ne 1 ]; then
                echo "::error::$svc did not reach healthy status"
                exit 1
              fi
            done

            echo "ql and jobs services healthy."
            docker image prune -f
