name: master-pipeline

on:
  push:
    branches:
      - master

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.11.0

      # ESLint and Prettier must be in `package.json`
      - name: Install Node.js dependencies
        run: npm ci

      - name: Run linters
        uses: wearerequired/lint-action@v2
        with:
          eslint: true
          #prettier: true
          continue_on_error: true

  publish:
    #    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Login to GitHub Container Registry
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build image and push to GitHub Packages
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/giveth/impact-graph:master
            ghcr.io/giveth/impact-graph:${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Redeploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST_ALL }}
          username: ${{ secrets.PROD_USERNAME_ALL }}
          key: ${{ secrets.PROD_PRIVATE_KEY_ALL }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd giveth-all
            # Pin to the immutable per-commit tag so every job in this run deploys the
            # same image. Scoped inline rather than written to a file, because env on
            # these hosts is managed centrally via Vault.
            IMPACT_GRAPH_IMAGE="ghcr.io/giveth/impact-graph:${{ github.sha }}" \
              docker compose -f docker-compose.prod.yml pull

  migrate:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Run DB Migrations (one-shot)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST_ALL }}
          username: ${{ secrets.PROD_USERNAME_ALL }}
          key: ${{ secrets.PROD_PRIVATE_KEY_ALL }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd giveth-all
            echo "Running database migrations (one-shot) before rollout"
            # One-shot container: runs migrations, then exits. Non-zero exit fails the deploy.
            IMPACT_GRAPH_IMAGE="ghcr.io/giveth/impact-graph:${{ github.sha }}" \
              docker compose -f docker-compose.prod.yml run --rm impact-graph-migrations
            echo "Migrations complete"

  rollout-deploy-1:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Redeploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST_ALL }}
          username: ${{ secrets.PROD_USERNAME_ALL }}
          key: ${{ secrets.PROD_PRIVATE_KEY_ALL }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd giveth-all
            ## Update each backend service one by one
            ## First Deployment (images were pulled earlier)
            IMPACT_GRAPH_IMAGE="ghcr.io/giveth/impact-graph:${{ github.sha }}" \
              docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate impact-graph-ql1
            echo "First deployment phase triggered. Deep health checks deferred to verify-health job."

  rollout-deploy-2:
    needs: rollout-deploy-1
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Redeploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST_ALL }}
          username: ${{ secrets.PROD_USERNAME_ALL }}
          key: ${{ secrets.PROD_PRIVATE_KEY_ALL }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd giveth-all
            ## Update each backend service one by one
            ## Second Deployment (images were pulled earlier)
            IMPACT_GRAPH_IMAGE="ghcr.io/giveth/impact-graph:${{ github.sha }}" \
              docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate impact-graph-ql2
            echo "Second deployment phase triggered. Health checks deferred to verify-health job."

  rollout-deploy-3:
    needs: rollout-deploy-2
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Redeploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST_ALL }}
          username: ${{ secrets.PROD_USERNAME_ALL }}
          key: ${{ secrets.PROD_PRIVATE_KEY_ALL }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd giveth-all
            ## Update each backend service one by one
            ## Third Deployment (images were pulled earlier)
            IMPACT_GRAPH_IMAGE="ghcr.io/giveth/impact-graph:${{ github.sha }}" \
              docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate impact-graph-ql3
            echo "Third deployment phase triggered. Health checks deferred to verify-health job."

  rollout-deploy-4:
    needs: rollout-deploy-3
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Redeploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST_ALL }}
          username: ${{ secrets.PROD_USERNAME_ALL }}
          key: ${{ secrets.PROD_PRIVATE_KEY_ALL }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd giveth-all
            ## Update each backend service one by one
            ## Fourth Deployment (images were pulled earlier)
            IMPACT_GRAPH_IMAGE="ghcr.io/giveth/impact-graph:${{ github.sha }}" \
              docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate impact-graph-ql4
            echo "Fourth deployment phase triggered. Health checks deferred to verify-health job."

  deploy-jobs:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Redeploy Jobs (dedicated jobs server)
        uses: appleboy/ssh-action@v1.0.0
        with:
          # Both environments' workers live on the SAME jobs droplet, so prod reuses
          # the STAGING_JOBS_* credentials — they identify the box, not the env. The
          # environments are separated by clone directory and service name below.
          host: ${{ secrets.STAGING_JOBS_HOST }}
          username: ${{ secrets.STAGING_JOBS_USERNAME }}
          key: ${{ secrets.STAGING_JOBS_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            # Prod lives in its own clone so it never shares a root .env with the
            # staging worker running on this same droplet.
            cd giveth-all-prod
            IMG="ghcr.io/giveth/impact-graph:${{ github.sha }}"
            echo "Pulling image on jobs server: $IMG"
            docker pull "$IMG"
            # Recreate ONLY the prod jobs worker. Image is scoped inline so a prod
            # deploy never repins the staging worker on this same box.
            IMPACT_GRAPH_IMAGE="$IMG" \
              docker compose -f docker-compose.jobs.prod.yml up -d --no-deps --force-recreate impact-graph-jobs-prod
            # Confirm it stayed up (not crash-looping). No healthcheck on this
            # service, so assert on container state instead.
            sleep 10
            status=$(docker inspect --format='{{.State.Status}}' impact-graph-jobs-prod 2>/dev/null || echo "missing")
            restarts=$(docker inspect --format='{{.RestartCount}}' impact-graph-jobs-prod 2>/dev/null || echo "?")
            echo "impact-graph-jobs-prod status=$status restarts=$restarts"
            if [ "$status" != "running" ]; then
              echo "::error::impact-graph-jobs-prod is not running (status: $status)"
              docker logs --tail 120 impact-graph-jobs-prod || true
              exit 1
            fi
            docker image prune -f
            echo "Jobs (prod) redeployed on dedicated server with $IMG"

  verify-health:
    needs:
      - rollout-deploy-1
      - rollout-deploy-2
      - rollout-deploy-3
      - rollout-deploy-4
    runs-on: ubuntu-latest
    steps:
      - name: Wait for services to stabilize
        run: sleep 180
      - name: SSH and Verify Health
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST_ALL }}
          username: ${{ secrets.PROD_USERNAME_ALL }}
          key: ${{ secrets.PROD_PRIVATE_KEY_ALL }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd giveth-all
            services=("impact-graph-ql1" "impact-graph-ql2" "impact-graph-ql3" "impact-graph-ql4")
            for svc in "${services[@]}"; do
              echo "Checking health for $svc ..."
              ok=0
              for i in {1..12}; do
                status=$(docker inspect --format='{{json .State.Health.Status}}' "$svc" 2>/dev/null || echo '""')
                if [ "$status" = "\"healthy\"" ]; then
                  echo "$svc is healthy"
                  ok=1
                  break
                fi
                echo "Current health: $status; waiting..."
                sleep 10
              done
              if [ $ok -ne 1 ]; then
                echo "::error::$svc did not reach healthy status"
                exit 1
              fi
            done

            # impact-graph-jobs now runs on the dedicated jobs server and is verified
            # in the deploy-jobs job.
            echo "All ql services healthy."
            docker image prune -f
